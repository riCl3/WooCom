name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Code style
        run: ./gradlew --no-daemon :app:ktlintCheck

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          echo "### CI result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint: \`./gradlew :app:lintDebug\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests: \`./gradlew :app:testDebugUnitTest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Assemble: \`./gradlew :app:assembleDebug\`" >> "$GITHUB_STEP_SUMMARY"
