# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Allow parallel module builds and reuse output across builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX package structure so each library's R class only exposes its own resources.
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official
android.nonTransitiveRClass=true

# Supabase backend (optional — both blank keeps the Firestore fallback; see MIGRATION.md).
